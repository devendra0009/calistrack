<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>CalisTrack</title>
    <script>
      try {
        var t = localStorage.getItem('calistrack.theme')
        var dark =
          t === 'dark' ||
          (t !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        var theme = dark ? 'dark' : 'light'
        document.documentElement.setAttribute('data-theme', theme)
        if (dark) document.documentElement.classList.add('dark')
        var m =
          localStorage.getItem('calistrack.workoutMusic.mood') ||
          localStorage.getItem('calistrack.mood')
        if (m === 'energy') m = 'groove'
        if (m === 'night') m = 'energetic'
        if (
          m === 'chill' ||
          m === 'focus' ||
          m === 'groove' ||
          m === 'energetic'
        ) {
          document.documentElement.dataset.moodPending = m
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <script>
      try {
        var pending = document.documentElement.dataset.moodPending
        if (pending) {
          document.body.setAttribute('data-mood', pending)
          delete document.documentElement.dataset.moodPending
        }
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
