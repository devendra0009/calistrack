spring.application.name=calistrack-backend

server.port=${PORT:8084}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME}
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_HIBERNATE_DIALECT}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL}

# Firebase Auth (same FIREBASE_CONFIG_BASE64 pattern as event-booking)
# Web API key is required for Identity Toolkit register/login/refresh REST calls
firebase.api-key=${FIREBASE_API_KEY}

# OpenAPI / Swagger UI — http://localhost:8084/swagger-ui.html
# On Render set OPENAPI_SERVER_URL=https://your-service.onrender.com (not localhost / internal PORT)
openapi.server-url=${OPENAPI_SERVER_URL:}
openapi.local-server-url=${OPENAPI_LOCAL_SERVER_URL:http://localhost:8084}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
# Trust X-Forwarded-* from Render's proxy so generated links use https
server.forward-headers-strategy=framework

# CORS — comma-separated. On Render include GitHub Pages:
# APP_CORS_ALLOWED_ORIGIN_PATTERNS=http://localhost:*,http://127.0.0.1:*,https://*.github.io
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}

# Flyway (ADR-003). Disabled by default so existing ddl-auto setups keep working.
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Never accept multipart uploads on this API (direct-to-storage only)
spring.servlet.multipart.enabled=false

# Media — direct-to-storage uploads (no multipart on this API)
# Switch with MEDIA_PRIMARY_PROVIDER=cloudinary|aws|local (no business-logic changes)
media.primary-provider=${MEDIA_PRIMARY_PROVIDER:local}
media.upload.max-file-size-bytes=${MEDIA_MAX_FILE_SIZE_BYTES:52428800}
media.upload.download-url-ttl-seconds=${MEDIA_DOWNLOAD_URL_TTL_SECONDS:3600}
media.upload.allowed-mime-types=${MEDIA_ALLOWED_MIME_TYPES:image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm,video/quicktime,application/pdf}

media.cloudinary.enabled=${CLOUDINARY_ENABLED:false}
media.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
media.cloudinary.api-key=${CLOUDINARY_API_KEY:}
media.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
media.cloudinary.folder=${CLOUDINARY_FOLDER:calistrack}
media.cloudinary.upload-preset=${CLOUDINARY_UPLOAD_PRESET:}

media.aws.enabled=${AWS_S3_ENABLED:false}
media.aws.region=${AWS_REGION:us-east-1}
media.aws.bucket=${AWS_S3_BUCKET:}
media.aws.access-key-id=${AWS_ACCESS_KEY_ID:}
media.aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:}
media.aws.key-prefix=${AWS_S3_KEY_PREFIX:calistrack/}
media.aws.endpoint-override=${AWS_S3_ENDPOINT:}

media.local.enabled=${MEDIA_LOCAL_ENABLED:false}
media.local.base-path=${MEDIA_LOCAL_BASE_PATH:./media-uploads}
media.local.public-base-url=${MEDIA_LOCAL_PUBLIC_BASE_URL:http://localhost:8084/api/v1/media/local}

# AI Coach — OpenRouter (OpenAI-compatible). Never commit real keys.
# Spring AI 2.x + openai-java expects base-url including /v1.
spring.ai.openai.api-key=${OPENROUTER_API_KEY}
spring.ai.openai.base-url=${SPRING_AI_OPENAI_BASE_URL:https://openrouter.ai/api/v1}
spring.ai.openai.chat.model=${SPRING_AI_OPENAI_CHAT_MODEL:google/gemma-4-27b-it:free}
spring.ai.openai.chat.temperature=${SPRING_AI_OPENAI_CHAT_TEMPERATURE:0.4}
spring.ai.openai.custom-headers.HTTP-Referer=${AI_COACH_HTTP_REFERER:https://calistrack.app}
spring.ai.openai.custom-headers.X-Title=${AI_COACH_APP_TITLE:CaliTrack}
spring.ai.retry.max-attempts=${SPRING_AI_RETRY_MAX_ATTEMPTS:3}

# AI Coach app settings (provider switch: gemma | future gpt/llama/ollama/…)
calistrack.ai.coach.provider=${AI_COACH_PROVIDER:gemma}
calistrack.ai.coach.max-message-length=${AI_COACH_MAX_MESSAGE_LENGTH:4000}

# Keep-alive (Render / Railway / Fly free-tier anti-idle). Disabled locally by default.
# On Render set KEEP_ALIVE_ENABLED=true and KEEP_ALIVE_BASE_URL=https://your-service.onrender.com
calistrack.keep-alive.enabled=${KEEP_ALIVE_ENABLED:false}
calistrack.keep-alive.base-url=${KEEP_ALIVE_BASE_URL:}
calistrack.keep-alive.health-path=${KEEP_ALIVE_HEALTH_PATH:/health}
calistrack.keep-alive.time-zone=${KEEP_ALIVE_TIME_ZONE:Asia/Kolkata}
calistrack.keep-alive.interval=${KEEP_ALIVE_INTERVAL:10m}
calistrack.keep-alive.initial-delay=${KEEP_ALIVE_INITIAL_DELAY:60s}
calistrack.keep-alive.provider=${KEEP_ALIVE_PROVIDER:render}
calistrack.keep-alive.windows[0].start=${KEEP_ALIVE_WINDOW_START:05:00}
calistrack.keep-alive.windows[0].end=${KEEP_ALIVE_WINDOW_END:23:00}
