# Example keep-alive configuration (YAML).
# Not loaded by Spring Boot (filename has no application- prefix).
# Copy into application-render.yml / a profile, or set KEEP_ALIVE_* env vars on the host.
#
# Extensibility tips:
#   weekday-windows / weekend-windows — optional overrides of "windows"
#   schedules — day-specific multi-window rules (highest priority)
#   provider — render | railway | fly | … (logged; reserved for future behaviour)
#
# IMPORTANT: base-url must be the public service URL. localhost will not keep Render awake.

calistrack:
  keep-alive:
    enabled: true
    base-url: https://your-service.onrender.com
    health-path: /health
    time-zone: Asia/Kolkata
    interval: 10m
    initial-delay: 60s
    provider: render
    # Default active window (IST): 05:00 inclusive → 23:00 exclusive
    windows:
      - start: "05:00"
        end: "23:00"

    # weekday-windows:
    #   - start: "05:00"
    #     end: "23:00"
    # weekend-windows:
    #   - start: "07:00"
    #     end: "22:00"

